name: Build
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, pablo, samuel]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn --batch-mode --no-transfer-progress clean verify